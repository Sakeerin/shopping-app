### confirmOrder
Confirm order after successful payment (called by Stripe webhook).

**File**: `services/orders.ts`
**Authorization**: Internal (webhook)

```typescript
async function confirmOrder(paymentIntentId: string): Promise<void>

Input:
  paymentIntentId: string (Stripe Payment Intent ID)

Behavior:
  1. Find order by paymentIntentId
  2. Update order status to PROCESSING
  3. Update payment status to SUCCEEDED
  4. Send order confirmation email
  5. Clear user's cart
  6. Create audit log entry
```

