# Order Management Contracts

## Server Actions

### createOrder
Create order from cart (checkout process).

**File**: `actions/checkout.ts`
**Authorization**: Public (works for guest and authenticated users)

```typescript
async function createOrder(data: CheckoutInput): Promise<OrderResult>

Input:
  shippingAddress: {
    fullName: string
    street: string
    street2?: string
    city: string
    state: string
    postalCode: string
    country: string
    phone: string
  }
  billingAddress?: Address (defaults to shipping address)
  saveAddress?: boolean (for authenticated users)
  email: string (for guest checkout)
  notes?: string (customer order notes)

Output (Success):
  success: true
  order: {
    id: string
    orderNumber: string
    paymentIntentClientSecret: string // For Stripe Elements
  }

Output (Error):
  success: false
  error: {
    code: "EMPTY_CART" | "VALIDATION_ERROR" | "OUT_OF_STOCK" | "PAYMENT_INIT_FAILED"
    message: string
    outOfStockItems?: Array<{ productName: string, requested: number, available: number }>
  }
```

**Order Creation Flow**:
1. Validate cart is not empty
2. Validate all items still in stock
3. Lock inventory (prevent overselling)
4. Calculate totals (subtotal, tax, shipping)
5. Create order record (status: PENDING)
6. Create Stripe Payment Intent
7. Return client secret for frontend payment
8. Clear cart on success

**Inventory Locking**:
```typescript
// Use database transaction to prevent race conditions
await prisma.$transaction(async (tx) => {
  for (const item of cartItems) {
    await tx.product.update({
      where: { id: item.productId, stock: { gte: item.quantity } },
      data: { stock: { decrement: item.quantity } }
    })
  }
  // Create order...
})
```

