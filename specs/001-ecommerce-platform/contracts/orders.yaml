### updateOrderStatus
Update order status (admin only).

**File**: `actions/orders.ts`
**Authorization**: Admin

```typescript
async function updateOrderStatus(orderId: string, data: OrderStatusUpdate): Promise<OrderResult>

Input:
  orderId: string
  status: OrderStatus
  trackingNumber?: string (required if status is SHIPPED)
  adminNotes?: string

Output (Success):
  success: true
  order: Order

Output (Error):
  success: false
  error: {
    code: "NOT_FOUND" | "INVALID_STATUS_TRANSITION"
    message: string
  }
```

**Valid Status Transitions**:
- PENDING → PROCESSING | CANCELLED
- PROCESSING → SHIPPED | CANCELLED
- SHIPPED → DELIVERED
- Any status → REFUNDED (admin only)

**Side Effects**:
- Send customer notification email on status change
- If SHIPPED, email includes tracking number
- If CANCELLED/REFUNDED, initiate Stripe refund
- If CANCELLED, restore inventory

