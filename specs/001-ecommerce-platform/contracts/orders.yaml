### cancelOrder
Cancel an order (customer or admin).

**File**: `actions/orders.ts`
**Authorization**: Authenticated (own orders before SHIPPED) or Admin (any order)

```typescript
async function cancelOrder(orderId: string, reason?: string): Promise<Result>

Input:
  orderId: string
  reason?: string

Output (Success):
  success: true
  message: "Order cancelled"

Output (Error):
  success: false
  error: {
    code: "NOT_FOUND" | "UNAUTHORIZED" | "CANNOT_CANCEL"
    message: string
  }
```

**Business Rules**:
- Customers can cancel PENDING or PROCESSING orders
- Cannot cancel SHIPPED, DELIVERED, or already CANCELLED orders
- Admins can cancel any order before DELIVERED
- Refund payment if already charged
- Restore inventory stock

