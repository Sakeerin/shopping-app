## Usage Examples

### Checkout Process (Client Component)
```typescript
'use client'

import { createOrder } from '@/actions/checkout'
import { Elements, PaymentElement } from '@stripe/react-stripe-js'

function CheckoutForm({ cart }) {
  async function handleCheckout(formData: FormData) {
    // Create order and get payment intent
    const result = await createOrder({
      shippingAddress: {
        fullName: formData.get('fullName'),
        street: formData.get('street'),
        city: formData.get('city'),
        state: formData.get('state'),
        postalCode: formData.get('postalCode'),
        country: 'US',
        phone: formData.get('phone')
      },
      email: formData.get('email')
    })

    if (!result.success) {
      toast.error(result.error.message)
      return
    }

    // Initialize Stripe with client secret
    setClientSecret(result.order.paymentIntentClientSecret)
  }

  return (
    <form action={handleCheckout}>
      {/* Address fields */}
      <Elements stripe={stripePromise} options={{ clientSecret }}>
        <PaymentElement />
        <button type="submit">Place Order</button>
      </Elements>
    </form>
  )
}
```

### Order History (Server Component)
```typescript
// app/(shop)/orders/page.tsx
import { getOrders } from '@/services/orders'
import { getServerSession } from 'next-auth'

export default async function OrdersPage() {
  const session = await getServerSession()
  const orders = await getOrders(session.user.id)

  return (
    <div>
      <h1>Order History</h1>
      {orders.data.map(order => (
        <OrderCard key={order.id} order={order} />
      ))}
    </div>
  )
}
```

### Admin Order Management (Server Component)
```typescript
// app/(dashboard)/admin/orders/page.tsx
import { getAllOrders } from '@/services/orders'

