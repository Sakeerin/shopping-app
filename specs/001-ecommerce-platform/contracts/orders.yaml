## Order Calculations

### Subtotal
```typescript
subtotal = sum(orderItem.quantity * orderItem.priceSnapshot for each item)
```

### Tax Calculation
```typescript
// Simple tax calculation by state
const TAX_RATES = {
  'CA': 0.0725, // 7.25%
  'NY': 0.04,   // 4%
  'TX': 0.0625, // 6.25%
  // ... other states
}

taxAmount = subtotal * (TAX_RATES[shippingAddress.state] || 0)
```

**Future Enhancement**: Integrate with Avalara/TaxJar for accurate tax calculation

### Shipping Cost
```typescript
// Flat rate shipping (MVP)
const SHIPPING_RATES = {
  'STANDARD': 5.99,
  'EXPRESS': 15.99
}

shippingCost = SHIPPING_RATES['STANDARD']

// Free shipping threshold
if (subtotal >= 50) {
  shippingCost = 0
}
```

**Future Enhancement**: Integrate with shipping carrier APIs (UPS, FedEx, USPS)

### Total
```typescript
totalAmount = subtotal + taxAmount + shippingCost - discountAmount
```

