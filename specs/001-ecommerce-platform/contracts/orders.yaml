## Order States

### State Diagram
```
PENDING
  ↓ (payment succeeded)
PROCESSING
  ↓ (admin ships order)
SHIPPED
  ↓ (delivered)
DELIVERED

Any state (before SHIPPED) → CANCELLED
PROCESSING/SHIPPED → REFUNDED (admin action)
```

### State Descriptions
- **PENDING**: Order created, awaiting payment
- **PROCESSING**: Payment successful, preparing order
- **SHIPPED**: Order shipped to customer
- **DELIVERED**: Order delivered successfully
- **CANCELLED**: Order cancelled (before shipping)
- **REFUNDED**: Order refunded after payment

---

## Error Codes

### EMPTY_CART
User attempted checkout with empty cart.

### OUT_OF_STOCK
One or more items are no longer available.

### PAYMENT_INIT_FAILED
Failed to create Stripe Payment Intent.

### INVALID_STATUS_TRANSITION
Attempted invalid order status change.

### CANNOT_CANCEL
Order cannot be cancelled (already shipped/delivered).

