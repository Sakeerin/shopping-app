## Email Notifications

### Order Confirmation
**Trigger**: Payment succeeded
**Template**: `order-confirmation.tsx`
**Content**:
- Order number and date
- Items ordered with images
- Shipping address
- Payment summary
- Estimated delivery date
- Link to order tracking page

### Shipping Notification
**Trigger**: Order status changed to SHIPPED
**Template**: `order-shipped.tsx`
**Content**:
- Order number
- Tracking number with carrier link
- Estimated delivery date
- Shipped items summary

### Delivery Confirmation
**Trigger**: Order status changed to DELIVERED
**Template**: `order-delivered.tsx`
**Content**:
- Order number
- Request for review
- Link to product review pages

### Cancellation Confirmation
**Trigger**: Order cancelled
**Template**: `order-cancelled.tsx`
**Content**:
- Order number
- Cancellation reason
- Refund information
- Customer support contact

