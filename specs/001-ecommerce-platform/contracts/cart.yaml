## Stock Validation

Before any cart operation (add, update), validate stock:

```typescript
async function validateStock(productId: string, variantId?: string, quantity: number): Promise<boolean> {
  const item = variantId
    ? await prisma.productVariant.findUnique({ where: { id: variantId } })
    : await prisma.product.findUnique({ where: { id: productId } })

  return item && item.stock >= quantity
}
```

**Error Messages**:
- `OUT_OF_STOCK`: "This item is currently out of stock"
- `INSUFFICIENT_STOCK`: "Only {stock} items available"

---

## Price Snapshots

When adding to cart, store current price:

```typescript
const currentPrice = variant
  ? product.price + variant.priceAdjustment
  : product.price

await prisma.cartItem.create({
  data: {
    cartId,
    productId,
    variantId,
    quantity,
    priceSnapshot: currentPrice // Preserve price at time of add
  }
})
```

**Rationale**: Protects against price changes after adding to cart

