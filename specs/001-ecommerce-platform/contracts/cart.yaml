# Shopping Cart Contracts

## Server Actions

### addToCart
Add a product to the shopping cart.

**File**: `actions/cart.ts`
**Authorization**: Public (works for guest and authenticated users)

```typescript
async function addToCart(data: AddToCartInput): Promise<CartResult>

Input:
  productId: string
  variantId?: string
  quantity: number (min: 1, max: 99, default: 1)

Output (Success):
  success: true
  cart: {
    id: string
    items: CartItem[]
    subtotal: number
    itemCount: number
  }

Output (Error):
  success: false
  error: {
    code: "NOT_FOUND" | "OUT_OF_STOCK" | "INSUFFICIENT_STOCK" | "INVALID_QUANTITY"
    message: string
  }
```

**Business Logic**:
- If item already in cart, increase quantity
- Check stock availability before adding
- Create cart if user doesn't have one
- For guests, use session ID to identify cart
- For authenticated users, merge guest cart on login

**Side Effects**:
- Revalidates `/cart` page
- Updates Zustand cart store

---

### updateCartItem
Update quantity of an item in cart.

**File**: `actions/cart.ts`
**Authorization**: Public

```typescript
async function updateCartItem(itemId: string, quantity: number): Promise<CartResult>

Input:
  itemId: string (cart item ID)
  quantity: number (min: 0, max: 99)

Output (Success):
  success: true
  cart: Cart

Output (Error):
  success: false
  error: {
    code: "NOT_FOUND" | "INSUFFICIENT_STOCK" | "INVALID_QUANTITY"
    message: string
  }
```

**Business Logic**:
- If quantity is 0, remove item from cart
- Check stock availability before updating
- Recalculate cart totals

**Side Effects**:
- Revalidates `/cart` page
- Updates Zustand cart store

