## Error Codes

### NOT_FOUND
Cart item or product not found.

### OUT_OF_STOCK
Product completely out of stock.

### INSUFFICIENT_STOCK
Requested quantity exceeds available stock.

### INVALID_QUANTITY
Quantity is invalid (< 1 or > 99).

### INVALID_CODE
Promo code does not exist or is inactive.

### CODE_EXPIRED
Promo code has expired.

### USAGE_LIMIT_EXCEEDED
Promo code usage limit reached.

### MIN_PURCHASE_NOT_MET
Cart subtotal doesn't meet promo code minimum.

