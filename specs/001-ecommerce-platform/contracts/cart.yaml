### mergeGuestCart
Merge guest cart with user cart on login.

**File**: `services/cart.ts`
**Authorization**: Authenticated (internal use)

```typescript
async function mergeGuestCart(userId: string, sessionId: string): Promise<void>

Input:
  userId: string (logged in user)
  sessionId: string (guest session)

Behavior:
  1. Fetch guest cart by sessionId
  2. Fetch user cart by userId
  3. Merge items (combine quantities if same product)
  4. Delete guest cart
  5. Update user cart
```

**Merge Logic**:
- If item exists in both carts, add quantities together
- Keep price snapshot from guest cart (most recent)
- Check stock availability during merge

