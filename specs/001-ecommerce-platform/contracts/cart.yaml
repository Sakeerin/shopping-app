## Cart State Management

### Client-Side Store (Zustand)
```typescript
// store/cart-store.ts
interface CartStore {
  items: CartItem[]
  itemCount: number
  subtotal: number
  discountAmount: number
  promoCode: string | null

  // Actions
  addItem: (item: Product, quantity: number) => Promise<void>
  updateQuantity: (itemId: string, quantity: number) => Promise<void>
  removeItem: (itemId: string) => Promise<void>
  applyPromo: (code: string) => Promise<void>
  removePromo: () => Promise<void>
  sync: () => Promise<void> // Sync with server
}
```

### Persistence
- **Guest Users**: localStorage (`cart-storage` key)
- **Authenticated Users**: Database (PostgreSQL)
- **Sync**: On login, merge localStorage cart with database cart

---

## Cart Calculations

### Subtotal
```typescript
subtotal = sum(item.quantity * item.priceSnapshot for each item)
```

### Discount Amount
```typescript
if (promoCode.discountType === 'PERCENTAGE') {
  discountAmount = subtotal * (promoCode.discountValue / 100)
  if (promoCode.maxDiscount) {
    discountAmount = min(discountAmount, promoCode.maxDiscount)
  }
} else if (promoCode.discountType === 'FIXED') {
  discountAmount = min(promoCode.discountValue, subtotal)
}
```

### Total (for display, before checkout)
```typescript
total = subtotal - discountAmount
// Note: Taxes and shipping calculated at checkout
```

