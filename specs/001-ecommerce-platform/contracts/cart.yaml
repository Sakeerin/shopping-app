## Usage Examples

### Add to Cart (Server Action)
```typescript
'use client'

import { addToCart } from '@/actions/cart'
import { useRouter } from 'next/navigation'

function AddToCartButton({ productId }: { productId: string }) {
  const router = useRouter()

  async function handleAddToCart() {
    const result = await addToCart({
      productId,
      quantity: 1
    })

    if (result.success) {
      toast.success('Added to cart')
      router.refresh() // Refresh cart count
    } else {
      toast.error(result.error.message)
    }
  }

  return <button onClick={handleAddToCart}>Add to Cart</button>
}
```

### Get Cart (Server Component)
```typescript
// app/(shop)/cart/page.tsx
import { getCart } from '@/services/cart'
import { getServerSession } from 'next-auth'

export default async function CartPage() {
  const session = await getServerSession()
  const cart = await getCart(session?.user?.id)

  if (!cart || cart.items.length === 0) {
    return <EmptyCart />
  }

  return <CartView cart={cart} />
}
```

### Update Quantity (Client Component)
```typescript
'use client'

import { updateCartItem } from '@/actions/cart'

function QuantitySelector({ itemId, currentQuantity }) {
  async function handleUpdate(newQuantity: number) {
    if (newQuantity === 0) {
      // Remove item
      await removeFromCart(itemId)
    } else {
      await updateCartItem(itemId, newQuantity)
    }
  }

  return (
    <select
      value={currentQuantity}
      onChange={(e) => handleUpdate(Number(e.target.value))}
    >
      {[1, 2, 3, 4, 5].map(num => (
        <option key={num} value={num}>{num}</option>
      ))}
    </select>
  )
}
```
