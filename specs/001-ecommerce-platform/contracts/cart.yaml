### applyPromoCode
Apply a promotional discount code to cart.

**File**: `actions/cart.ts`
**Authorization**: Public

```typescript
async function applyPromoCode(code: string): Promise<PromoResult>

Input:
  code: string (uppercase, alphanumeric)

Output (Success):
  success: true
  promo: {
    code: string
    discountType: "PERCENTAGE" | "FIXED"
    discountValue: number
    discountAmount: number
  }
  cart: {
    subtotal: number
    discountAmount: number
    total: number
  }

Output (Error):
  success: false
  error: {
    code: "INVALID_CODE" | "CODE_EXPIRED" | "USAGE_LIMIT_EXCEEDED" | "MIN_PURCHASE_NOT_MET"
    message: string
  }
```

**Validation**:
- Check code exists and is active
- Check not expired
- Check usage limits (total and per-user)
- Check minimum purchase amount requirement
- Check cart subtotal meets minimum

**Discount Calculation**:
- Percentage: `subtotal * (discountValue / 100)`
- Fixed: `min(discountValue, subtotal)`
- Apply maxDiscount cap if set

