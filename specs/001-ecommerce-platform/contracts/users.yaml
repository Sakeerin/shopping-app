### exportUserData
Export all user data (GDPR compliance).

**File**: `actions/profile.ts`
**Authorization**: Authenticated

```typescript
async function exportUserData(): Promise<UserDataExport>

Output:
  {
    user: User
    orders: Order[]
    reviews: Review[]
    addresses: Address[]
    exportDate: string
  }
```
