# User Profile Contracts

## Server Actions

### updateProfile
Update user profile information.

**File**: `actions/profile.ts`
**Authorization**: Authenticated

```typescript
async function updateProfile(data: UpdateProfileInput): Promise<UserResult>

Input:
  name?: string
  email?: string
  currentPassword?: string (required if changing email)
  newPassword?: string
  image?: string

Output (Success):
  success: true
  user: User

Output (Error):
  success: false
  error: { code: string, message: string }
```

