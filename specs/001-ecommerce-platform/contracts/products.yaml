## API Routes

### GET /api/search/autocomplete
Product search autocomplete for search bar.

**Authorization**: Public
**Rate Limit**: 100 requests/minute per IP

```typescript
Request Query:
  q: string (min: 2 characters)
  limit?: number (default: 5, max: 10)

Response:
  {
    products: Array<{
      id: string
      name: string
      slug: string
      price: number
      image: string
      category: string
    }>
    categories: Array<{
      id: string
      name: string
      slug: string
      productCount: number
    }>
  }
```

**Caching**: 5 minutes

