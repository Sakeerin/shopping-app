## Admin Server Actions

### createProduct
Create a new product (admin only).

**File**: `actions/products.ts`
**Authorization**: Admin

```typescript
async function createProduct(data: CreateProductInput): Promise<ProductResult>

Input:
  name: string (min: 2, max: 200)
  slug: string (unique, URL-safe)
  description: string (min: 10, max: 5000)
  price: number (min: 0.01)
  images: string[] (min: 1, max: 10, valid URLs)
  categoryId: string
  stock: number (min: 0, integer)
  isActive: boolean
  isFeatured: boolean
  metaTitle?: string (max: 60)
  metaDescription?: string (max: 160)
  variants?: Array<{
    variantType: string
    variantValue: string
    priceAdjustment: number
    stock: number
  }>

Output (Success):
  success: true
  product: Product

Output (Error):
  success: false
  error: {
    code: "VALIDATION_ERROR" | "SLUG_EXISTS"
    message: string
    fields?: { [key: string]: string }
  }
```

**Side Effects**:
- Revalidates product list pages
- Clears product cache

---

### updateProduct
Update existing product (admin only).

**File**: `actions/products.ts`
**Authorization**: Admin

```typescript
async function updateProduct(id: string, data: UpdateProductInput): Promise<ProductResult>

Input:
  id: string (product ID)
  name?: string
  slug?: string
  description?: string
  price?: number
  images?: string[]
  categoryId?: string
  stock?: number
  isActive?: boolean
  isFeatured?: boolean
  metaTitle?: string
  metaDescription?: string

Output (Success):
  success: true
  product: Product

Output (Error):
  success: false
  error: {
    code: "NOT_FOUND" | "VALIDATION_ERROR" | "SLUG_EXISTS"
    message: string
  }
```

**Side Effects**:
- Revalidates product detail page
- Revalidates category pages if category changed
- Updates cart items if price changed (notify users)

---

### deleteProduct
Soft delete a product (admin only).

**File**: `actions/products.ts`
**Authorization**: Admin

```typescript
async function deleteProduct(id: string): Promise<Result>

Input:
  id: string

Output (Success):
  success: true
  message: "Product deleted"

Output (Error):
  success: false
  error: {
    code: "NOT_FOUND" | "HAS_ACTIVE_ORDERS"
    message: string
  }
```

**Business Logic**:
- Sets `isActive` to false instead of deleting
- Removes from cart items
- Preserves in existing orders

