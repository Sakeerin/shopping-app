## Data Caching Strategy

### Product List
- Cache: 60 seconds (ISR)
- Revalidate on: Product create/update/delete

### Product Detail
- Cache: 60 seconds (ISR)
- Revalidate on: Product update, new review

### Categories
- Cache: 5 minutes (static)
- Revalidate on: Category create/update/delete

### Search Autocomplete
- Cache: 5 minutes (API route)
- No revalidation (stale-while-revalidate)

---

## Search Implementation

### Full-Text Search
Uses PostgreSQL full-text search on `products` table:

```sql
SELECT * FROM products
WHERE to_tsvector('english', name || ' ' || description)
  @@ to_tsquery('english', 'search query')
ORDER BY ts_rank(to_tsvector(...), to_tsquery(...)) DESC
```

### Autocomplete
- Fuzzy matching on product names
- Category name matching
- Maximum 5 product results + 3 category results
- Debounced to reduce API calls (300ms)

---

## Filtering Logic

### Price Range
```typescript
{
  minPrice?: number
  maxPrice?: number
}

// SQL: WHERE price >= minPrice AND price <= maxPrice
```

### Category
```typescript
{
  categoryId: string
}

// SQL: WHERE categoryId = ? OR parentCategoryId = ?
// (includes subcategories)
```

### Stock Availability
```typescript
{
  inStock: boolean // default: true
}

// SQL: WHERE stock > 0
```

---

## Sorting Options

- `price_asc`: Price low to high
- `price_desc`: Price high to low
- `name`: Alphabetical (A-Z)
- `newest`: Most recently added
- `popular`: Most purchased (requires order aggregation)
- `rating`: Highest rated (requires review aggregation)

---

## Related Products Algorithm

For product detail page:
1. Same category products
2. Price range ±20%
3. Exclude current product
4. Limit: 4 products
5. Order by: popularity or rating

---

## Error Codes

### SLUG_EXISTS
Product/category slug already in use.

### CIRCULAR_REFERENCE
Category parent reference would create a circular loop.

### HAS_ACTIVE_ORDERS
Cannot delete product with existing unfulfilled orders.

