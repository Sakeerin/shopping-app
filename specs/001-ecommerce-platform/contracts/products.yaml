### updateCategory
Update existing category (admin only).

**File**: `actions/products.ts`
**Authorization**: Admin

```typescript
async function updateCategory(id: string, data: UpdateCategoryInput): Promise<CategoryResult>

Input:
  id: string
  name?: string
  slug?: string
  description?: string
  image?: string
  parentId?: string
  displayOrder?: number

Output (Success):
  success: true
  category: Category

Output (Error):
  success: false
  error: {
    code: "NOT_FOUND" | "VALIDATION_ERROR" | "CIRCULAR_REFERENCE"
    message: string
  }
```

**Validation**:
- Prevent circular parent references
- Cannot set category as its own parent

