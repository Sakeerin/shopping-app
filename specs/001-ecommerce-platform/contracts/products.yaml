# Product Catalog Contracts

## Server Components (Data Fetching)

Most product data is fetched directly in Server Components using Prisma.

### getProducts
Fetch paginated product list.

**File**: `services/products.ts`
**Authorization**: Public

```typescript
async function getProducts(params: ProductFilters): Promise<ProductList>

Input:
  page?: number (default: 1)
  limit?: number (default: 20, max: 100)
  categoryId?: string
  minPrice?: number
  maxPrice?: number
  inStock?: boolean (default: true)
  isFeatured?: boolean
  sortBy?: "price_asc" | "price_desc" | "name" | "newest"
  search?: string

Output:
  data: Array<{
    id: string
    name: string
    slug: string
    description: string
    price: number
    images: string[]
    category: {
      id: string
      name: string
      slug: string
    }
    stock: number
    isActive: boolean
    isFeatured: boolean
    averageRating?: number
    reviewCount: number
  }>
  pagination: {
    page: number
    limit: number
    total: number
    totalPages: number
  }
```

---

