## Usage Examples

### Fetch Products (Server Component)
```typescript
// app/(shop)/products/page.tsx
import { getProducts } from '@/services/products'

export default async function ProductsPage({ searchParams }) {
  const products = await getProducts({
    page: searchParams.page || 1,
    categoryId: searchParams.category,
    sortBy: searchParams.sort || 'newest'
  })

  return <ProductGrid products={products.data} />
}
```

### Product Detail (Server Component with ISR)
```typescript
// app/(shop)/products/[slug]/page.tsx
export const revalidate = 60 // ISR: 60 seconds

export default async function ProductPage({ params }) {
  const product = await getProductBySlug(params.slug)

  if (!product) notFound()

  return <ProductDetail product={product} />
}
```

### Search Autocomplete (Client Component)
```typescript
'use client'

import { useState } from 'react'
import { useDebounce } from '@/hooks/use-debounce'

function SearchBar() {
  const [query, setQuery] = useState('')
  const debouncedQuery = useDebounce(query, 300)

  useEffect(() => {
    if (debouncedQuery.length >= 2) {
      fetch(`/api/search/autocomplete?q=${debouncedQuery}`)
        .then(res => res.json())
        .then(setResults)
    }
  }, [debouncedQuery])

  return <input onChange={(e) => setQuery(e.target.value)} />
}
```
